name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore tests/TILageMonitor.Tests.csproj
      - name: Test
        run: dotnet test tests/TILageMonitor.Tests.csproj -c Release --no-restore
      - name: Build
        run: dotnet build TILageMonitor.csproj -c Release --no-restore
