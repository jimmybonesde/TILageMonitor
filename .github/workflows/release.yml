name: Build and Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Release version tag (for example v1.0.8)
        required: true
        default: v1.0.8

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "${{ inputs.version }}"
          } else {
            "${{ github.ref_name }}"
          }
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Version muss dem Format vMAJOR.MINOR.PATCH entsprechen."
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "number=$($tag.TrimStart('v'))" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore tests/TILageMonitor.Tests.csproj

      - name: Test
        run: dotnet test tests/TILageMonitor.Tests.csproj -c Release --no-restore

      - name: Publish versioned app
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.number }}"
          dotnet publish TILageMonitor.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:Version=$version `
            -p:FileVersion="$version.0" `
            -p:AssemblyVersion="$version.0" `
            -p:InformationalVersion="${{ steps.version.outputs.tag }}" `
            -o publish

      - name: Create release package and checksums
        shell: pwsh
        run: |
          Copy-Item Install.ps1 publish/Install.ps1 -Force
          $zip = "TILageMonitor-${{ steps.version.outputs.tag }}-win-x64.zip"
          Compress-Archive -Path publish/TILageMonitor.exe, publish/TILageMonitor.ico, publish/Install.ps1 -DestinationPath $zip -Force
          Get-FileHash $zip, publish/TILageMonitor.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $($_.Path | Split-Path -Leaf)" } |
            Set-Content checksums.txt

      - uses: actions/upload-artifact@v4
        with:
          name: TILageMonitor-${{ steps.version.outputs.tag }}-win-x64
          path: |
            TILageMonitor-${{ steps.version.outputs.tag }}-win-x64.zip
            checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: TI-Lage Monitor ${{ steps.version.outputs.tag }}
          body: |
            ## TI-Lage Monitor ${{ steps.version.outputs.tag }}

            Windows-x64-Paket mit EXE, Installer und SHA-256-Prüfsummen.

            ### Hinweis
            - Windows 10/11
            - Unsigniert — SmartScreen kann warnen
            - Kein offizielles gematik-Produkt
          files: |
            TILageMonitor-${{ steps.version.outputs.tag }}-win-x64.zip
            publish/TILageMonitor.exe
            checksums.txt
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
