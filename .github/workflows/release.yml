name: Build and Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Release version tag (for example v1.0.8)
        required: true
        default: v1.0.8

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "${{ inputs.version }}"
          } else {
            "${{ github.ref_name }}"
          }
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Version muss dem Format vMAJOR.MINOR.PATCH entsprechen."
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "number=$($tag.TrimStart('v'))" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore tests/TILageMonitor.Tests.csproj

      - name: Test
        run: dotnet test tests/TILageMonitor.Tests.csproj -c Release --no-restore

      - name: Publish versioned app
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.number }}"
          dotnet publish TILageMonitor.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:EnableCompressionInSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:Version=$version `
            -p:FileVersion="$version.0" `
            -p:AssemblyVersion="$version.0" `
            -p:InformationalVersion=$version `
            -o publish

      - name: Create offline setup installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress --yes
          $version = "${{ steps.version.outputs.number }}"
          & "${env:ProgramFiles(x86)}\\Inno Setup 6\\ISCC.exe" "/DMyAppVersion=$version" installer/TILageMonitor.iss

      - name: Create installer checksum
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.number }}"
          $setup = "installer-out/TILageMonitor-$version-Setup.exe"
          Get-FileHash $setup -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $($_.Path | Split-Path -Leaf)" } |
            Set-Content checksums.txt

      - uses: actions/upload-artifact@v7
        with:
          name: TILageMonitor-${{ steps.version.outputs.tag }}-installer
          path: |
            installer-out/TILageMonitor-${{ steps.version.outputs.number }}-Setup.exe
            checksums.txt

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: TI-Lage Monitor ${{ steps.version.outputs.tag }}
          body: |
            ## TI-Lage Monitor ${{ steps.version.outputs.tag }}

            **Empfohlen:** `TILageMonitor-${{ steps.version.outputs.number }}-Setup.exe` — echter Windows-Installer ohne PowerShell.

            Enthält den Windows-Installer und eine SHA-256-Prüfsumme.

            ### Hinweis
            - Windows 10/11
            - Unsigniert — SmartScreen kann warnen
            - Kein offizielles gematik-Produkt
          files: |
            installer-out/TILageMonitor-${{ steps.version.outputs.number }}-Setup.exe
            checksums.txt
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
